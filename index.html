<!DOCTYPE html>
<html>
  <head>
    <title>quick dweet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body, html{
        background: #000;
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: Play;
        overflow: hidden;
      }
      .header{
        height: 32px;
        background: linear-gradient(90deg, #333,#333,#104,#304);
        color: #f80;
        font-size: 26px;
        padding-left: 10px;
        text-shadow: 0px 0px 8px #f00;
      }
      .main{
        overflow: hidden;
      }
      .textInput{
        display: inline-block;
        border-radius: 10px;
        width: calc(100vw - 100px);
        margin-left: 50px;
        vertical-align: top;
        min-height: 100px;
        height: calc(50vh - 300px);
        background: #333;
        color: #aa2;
        border: none;
        padding: 10px;
        margin-top: 0px;
      }
      .textInput:focus{
        outline: none;
      }
      #c{
        border: 3px solid #234;
        border-radius: 10px;
        position: absolute;
        left: 50%;
        top: calc(50vh - 120px);
        transform: translate(-50%, 0);
        height: calc(50vh - 20px);
        background-color: #fff;
      }
      #linkButton{
        border: none;
        border-radius: 10px;
        position: relative;
        left: 50%;
        transform: translate(-50%);
        width: 80px;
        padding: 5px;
        line-height: 1em;
        background-color: #208;
        color: #fff;
        font-family: Play;
        font-size: 40px;
        margin: 10px;
        cursor: pointer;
      }
      .copyButton{
        display: inline-block;
        width: 30px;
        height: 30px;
        background-image: url(/games_shared_assets/clippy.png);
        cursor: pointer;
        z-index: 500;
        background-size: 90% 90%;
        left: calc(50% + 180px);
        background-position: center center;
        background-repeat: no-repeat;
        border: none;
        background-color: #8fcc;
        margin: 5px;
        border-radius: 5px;
        vertical-align: middle;
      }
      #copyConfirmation{
        display: none;
        position: absolute;
        width: 100vw;
        height: 100vh;
        top: 0;
        left: 0;
        background: #012d;
        color: #8ff;
        opacity: 1;
        text-shadow: 0 0 5px #fff;
        font-size: 46px;
        text-align: center;
        z-index: 1000;
      }
      #innerCopied{
        position: absolute;
        top: 50%;
        width: 100%;
        z-index: 1020;
        text-align: center;
        transform: translate(0, -50%) scale(2.0, 1);
      }
      .resultLink{
        text-decoration: none;
        color: #fff;
        background: #4f86;
        padding: 10px;
        display: inline-block;
      }
      #resultDiv{
        position: absolute;
        margin-top: 50px;
        left: 50%;
        transform: translate(-50%);
      }
    </style>
  </head>
  <body>
    <div id="copyConfirmation"><div id="innerCopied">COPIED!</div></div>
    <div class="header">
    quick dweet
    </div>
    <div class="main">
      <button
        id="linkButton"
        onclick="copy()"
      >🔗</button>
      <textarea
        spellcheck="false"
        class="textInput"
        id="code"
        oninput="Update(this)"
      ></textarea>
      <canvas id="c"></canvas>
    </div>
    <script id="codeScript">
      window.UserFunc = () => { }
    </script>
    <script>
      
      c = document.querySelector('#c')
      c.tabIndex = 0
      x = c.getContext('2d')
      c.width = 1920
      c.height = 1080

      C = Math.cos
      S = Math.sin
      t = 0
      T = Math.tan

      var Rn = Math.random
      var p, q, d

      rsz = window.onresize = () =>{
        let b = document.body
        let margin = 5
        let n
        let d = .5625
        c.height = c.width * d
        if(b.clientHeight/2/b.clientWidth > d){
          c.style.width = `${(n=b.clientWidth/1) - margin*2}px`
          c.style.height = `${n*d - margin*2}px`
        }else{
          c.style.height = `${(n=b.clientHeight/2) - margin*2}px`
          c.style.width = `${n/d - margin*2}px`
        }
      }
      rsz()
      
      const Update = e => {
        var el = document.querySelector('#codeScript')
        el.remove()
        var newScript = document.createElement('script')
        newScript.id = 'codeScript'
        newScript.innerHTML = `
          window.UserFunc = () => {
            ${e.value}
          }`
        document.body.appendChild(newScript)
        t=0
        c.width = 1920
        c.height = 1080
        history.replaceState({},'',location.origin+location.pathname+'?code='+encodeURIComponent(e.value))
      }
      
      const copy = () => {
        var range = document.createRange()
        var el = document.createElement('div')
        el.style.display = 'none'
        el.innerHTML = location.href
        el.id="tempDiv"
        document.body.appendChild(el)
        range.selectNode(document.querySelector('#tempDiv'))
        window.getSelection().removeAllRanges()
        window.getSelection().addRange(range)
        document.execCommand("copy")
        window.getSelection().removeAllRanges()
        el = document.querySelector('#copyConfirmation')
        el.style.display = 'block';
        el.style.opacity = 1
        reduceOpacity = () => {
          if(+el.style.opacity > 0){
            el.style.opacity -= .08
            if(+el.style.opacity<.1){
              el.style.opacity = 1
              el.style.display = 'none'
            }else{
              setTimeout(()=>{
                reduceOpacity()
              }, 10)
            }
          }
        }
        setTimeout(()=>{reduceOpacity()}, 250)
      }      

      const R = (r,g,b) => `rgba(${r},${g},${b},1)`
      
      Draw = () => {
        window.UserFunc()
        t+=1/60
        requestAnimationFrame(Draw)
      }
      
      var l
      if((l=location.href.split('?code=')).length > 1){
        var code = document.querySelector('#code').innerHTML = decodeURIComponent(l[1])
        Update({value: code})
      }
      Draw()
    </script>
  </body>
</html>
